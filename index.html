<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola Hidup Sehat & Bugar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f8f5;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
        }

        .hero-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .content {
            padding: 30px 24px;
        }

        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1b5e20;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .btn-cta {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.82rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Gambar Banner Tema Kesehatan -->
        <img class="hero-img" src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80" alt="Gaya Hidup Sehat">

        <div class="content">
            <span class="badge">Panduan Kesehatan 2026</span>
            <h1>Mari Mulai Langkah Hidup Sehat Hari Ini!</h1>
            <p>Raih tubuh bugar, energi melimpah, dan kualitas hidup lebih baik dengan tips nutrisi serta pola hidup yang tepat.</p>

            <!-- GANTI LINK DI BAWAH DENGAN LINK TARGET ATAU WA KAMU -->
            <a href="https://WEBSITE-TUJUAN-KAMU.com" class="btn-cta">
                🌱 KLIK DI SINI UNTUK SELENGKAPNYA
            </a>

            <div class="footer-note">
                © 2026 Informasi Kesehatan. All rights reserved.
            </div>
        </div>
    </div>

</body>
</html>
